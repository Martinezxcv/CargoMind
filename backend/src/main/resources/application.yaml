spring:
  application:
    name: cargomind-backend

  datasource:
    url: jdbc:h2:mem:cargomind;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  jackson:
    mapper:
      accept-case-insensitive-enums: true

server:
  port: 8080

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: gemini-2.0-flash
    url: https://generativelanguage.googleapis.com/v1beta/models